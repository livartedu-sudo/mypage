<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>접객서비스 모니터링 및 대시보드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 pb-20">

    <div class="max-w-xl mx-auto bg-white min-h-screen shadow-md relative">
        
        <!-- 상단 헤더 -->
        <header class="bg-blue-700 text-white p-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
            <h1 class="font-bold text-lg" id="headerTitle">접객서비스 모니터링</h1>
            <button id="toggleBtn" onclick="switchView()" class="bg-blue-900 hover:bg-blue-800 text-white text-sm py-1.5 px-3 rounded shadow transition-colors font-medium">
                현황 보기
            </button>
        </header>

        <!-- ========================================== -->
        <!-- 1. 평가 폼 화면 -->
        <!-- ========================================== -->
        <div id="form_view">
            <form id="evaluationForm" onsubmit="handleSubmit(event)" class="p-4 space-y-6">
                <!-- 기본 정보 -->
                <section class="bg-blue-50 p-4 rounded-lg space-y-4 border border-blue-200 shadow-sm">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">구분</label>
                            <select id="division" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" required>
                                <option value="">선택</option>
                                <option value="리빙">리빙</option>
                                <option value="집테리어">집테리어</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">매장명</label>
                            <select id="storeName" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" required>
                                <option value="">매장 선택</option>
                                <optgroup label="백화점 (16점)">
                                    <option value="더현서">더현서</option>
                                    <option value="무역">무역</option>
                                    <option value="목동">목동</option>
                                    <option value="천호">천호</option>
                                    <option value="미아">미아</option>
                                    <option value="신촌">신촌</option>
                                    <option value="가산">가산</option>
                                    <option value="판교">판교</option>
                                    <option value="킨텍스">킨텍스</option>
                                    <option value="중동">중동</option>
                                    <option value="송도">송도</option>
                                    <option value="김포">김포</option>
                                    <option value="스페이스원">스페이스원</option>
                                    <option value="충청">충청</option>
                                    <option value="대구">대구</option>
                                    <option value="대전아울렛">대전아울렛</option>
                                </optgroup>
                                <optgroup label="로드샵 (11점)">
                                    <option value="강남">강남</option>
                                    <option value="용산">용산</option>
                                    <option value="수원">수원</option>
                                    <option value="고양">고양</option>
                                    <option value="용인">용인</option>
                                    <option value="기흥">기흥</option>
                                    <option value="대전">대전</option>
                                    <option value="울산">울산</option>
                                    <option value="광주">광주</option>
                                    <option value="부산">부산</option>
                                    <option value="동부산">동부산</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">방문 일시</label>
                        <input type="datetime-local" id="visitTime" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">평가자 사번</label>
                            <input type="text" id="empId" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="예: v123456" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">평가자 성명</label>
                            <input type="text" id="empName" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="예: 홍길동" required>
                        </div>
                    </div>
                </section>

                <!-- 평가 종류 선택 -->
                <section>
                    <label class="block text-base font-bold text-gray-800 mb-2">어떤 평가를 진행하시겠습니까?</label>
                    <select id="evalType" onchange="toggleEvalForm()" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-blue-900 bg-white shadow-sm" required>
                        <option value="">-- 평가 종류 선택 --</option>
                        <option value="form1">1. 웰컴존·상담존 모니터링 평가</option>
                        <option value="form2">2. 판매사원 접객·배웅 서비스 수준 평가</option>
                    </select>
                </section>

                <!-- 문항 영역 -->
                <div id="form1_container" class="hidden space-y-6"></div>
                <div id="form2_container" class="hidden space-y-6"></div>

                <!-- 평가자 의견 & 제출 -->
                <section id="feedback_container" class="hidden pt-4 border-t-2 border-gray-200">
                    <label class="block font-bold text-gray-800 mb-2">평가자 의견 <span class="text-sm font-normal text-gray-500">(우수/미흡 등)</span></label>
                    <textarea id="feedbackText" rows="4" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="자유롭게 주관식 의견을 작성해주세요."></textarea>
                    
                    <button type="submit" id="submitBtn" class="mt-6 w-full bg-blue-700 text-white font-bold py-4 rounded-lg shadow hover:bg-blue-800 transition-colors text-lg">
                        평가 제출하기
                    </button>
                </section>
            </form>
        </div>

        <!-- ========================================== -->
        <!-- 2. 대시보드 화면 -->
        <!-- ========================================== -->
        <div id="dashboard_view" class="hidden p-4 space-y-6 bg-gray-50 min-h-screen">
            
            <div class="space-y-4">
                <div class="flex gap-2 bg-gray-200 p-1 rounded-lg">
                    <button id="tabBtn1" onclick="switchDashboardTab('form1')" class="flex-1 py-2 text-sm font-bold rounded shadow-sm bg-white text-blue-700 transition-colors">
                        웰컴/상담존
                    </button>
                    <button id="tabBtn2" onclick="switchDashboardTab('form2')" class="flex-1 py-2 text-sm font-bold rounded text-gray-500 hover:text-gray-700 transition-colors">
                        접객서비스
                    </button>
                </div>
                
                <!-- [수정됨] 대시보드 타이틀 및 필터 (한 줄로 원상복구) -->
                <div class="flex justify-between items-center border-b-2 border-gray-300 pb-2 gap-2">
                    <h2 id="dashboardTypeTitle" class="text-lg font-bold text-gray-800 whitespace-nowrap">
                        웰컴존·상담존 모니터링 현황
                    </h2>
                    <select id="dashboardStoreFilter" onchange="updateDashboardUI()" class="p-1.5 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-blue-900 bg-white shadow-sm text-sm">
                        <option value="all">전체 매장 (통합)</option>
                        <optgroup label="백화점">
                            <option value="더현서">더현서</option>
                            <option value="무역">무역</option>
                            <option value="목동">목동</option>
                            <option value="천호">천호</option>
                            <option value="미아">미아</option>
                            <option value="신촌">신촌</option>
                            <option value="가산">가산</option>
                            <option value="판교">판교</option>
                            <option value="킨텍스">킨텍스</option>
                            <option value="중동">중동</option>
                            <option value="송도">송도</option>
                            <option value="김포">김포</option>
                            <option value="스페이스원">스페이스원</option>
                            <option value="충청">충청</option>
                            <option value="대구">대구</option>
                            <option value="대전아울렛">대전아울렛</option>
                        </optgroup>
                        <optgroup label="로드샵">
                            <option value="강남">강남</option>
                            <option value="용산">용산</option>
                            <option value="수원">수원</option>
                            <option value="고양">고양</option>
                            <option value="용인">용인</option>
                            <option value="기흥">기흥</option>
                            <option value="대전">대전</option>
                            <option value="울산">울산</option>
                            <option value="광주">광주</option>
                            <option value="부산">부산</option>
                            <option value="동부산">동부산</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <!-- 집계 카드 -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 text-center">
                    <p class="text-sm text-gray-500 font-semibold mb-1">총 평가 건수</p>
                    <p class="text-3xl font-bold text-blue-700" id="totalCount">0건</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 text-center">
                    <p class="text-sm text-gray-500 font-semibold mb-1">전체 평균 점수</p>
                    <p class="text-3xl font-bold text-blue-700" id="totalAvg">0점</p>
                </div>
            </div>

            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                <h3 class="font-bold text-gray-800 mb-4">구분별 평균 점수 요약 (100점 환산)</h3>
                <div class="h-64">
                    <canvas id="scoreChart"></canvas>
                </div>
            </div>

            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                <h3 class="font-bold text-gray-800 mb-4">세부 항목별 평균 점수 (100점 환산)</h3>
                <div id="detailedScoresList" class="space-y-4">
                    <!-- 자바스크립트로 생성 -->
                </div>
            </div>

            <!-- 모니터링 내역 리스트 -->
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                <h3 class="font-bold text-gray-800 mb-4">최근 모니터링 내역</h3>
                <div id="recentEvalList" class="space-y-2">
                    <p class="text-sm text-gray-400 text-center py-4">등록된 평가 데이터가 없습니다.</p>
                </div>
            </div>

        </div>

        <!-- ========================================== -->
        <!-- 3. 관리자 화면 (숨김 처리) -->
        <!-- ========================================== -->
        <div id="admin_view" class="hidden p-4 space-y-4 bg-gray-50 min-h-screen">
            <div class="flex justify-between items-center mb-4 border-b-2 border-gray-300 pb-3">
                <h2 class="text-xl font-bold text-red-700">관리자 페이지 (Raw Data)</h2>
                <button onclick="closeAdmin()" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-1 rounded text-sm shadow">닫기</button>
            </div>
            
            <div id="adminListContainer" class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <ul id="adminList" class="divide-y divide-gray-200">
                    <!-- 리스트 삽입 -->
                </ul>
            </div>

            <div id="adminDetailContainer" class="hidden space-y-4">
                <button onclick="backToAdminList()" class="bg-gray-200 text-gray-800 px-4 py-2 rounded text-sm font-bold shadow-sm hover:bg-gray-300">← 목록으로 돌아가기</button>
                <div id="adminDetailContent" class="space-y-4"></div>
            </div>
        </div>

        <!-- 관리자 진입 버튼 (하단) -->
        <footer class="text-center py-8">
            <button onclick="checkAdminPassword()" class="text-xs text-gray-300 hover:text-gray-500 underline transition-colors">관리자 전용 페이지</button>
        </footer>

    </div>

    <!-- 스크립트 로직 -->
    <script>
        const SUPABASE_URL = 'https://agysoivrjsbbtiqlsxud.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFneXNvaXZyanNiYnRpcWxzeHVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTA3NzIsImV4cCI6MjEwMzM2Njc3Mn0.pMfOlCkNeF1pbuyTUHBzOgC5FziWOeXeKMTH16vARJw';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentView = 'form';
        let allDashboardData = [];
        let currentDashboardTab = 'form1';

        async function switchView() {
            const formView = document.getElementById('form_view');
            const dashboardView = document.getElementById('dashboard_view');
            const adminView = document.getElementById('admin_view');
            const btn = document.getElementById('toggleBtn');
            const title = document.getElementById('headerTitle');

            if (currentView === 'form' || currentView === 'admin') {
                formView.classList.add('hidden');
                adminView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                btn.innerText = '평가 작성하기';
                title.innerText = '모니터링 현황';
                currentView = 'dashboard';
                await loadDashboardData();
            } else {
                dashboardView.classList.add('hidden');
                adminView.classList.add('hidden');
                formView.classList.remove('hidden');
                btn.innerText = '현황 보기';
                title.innerText = '접객서비스 모니터링';
                currentView = 'form';
            }
        }

        function checkAdminPassword() {
            const pw = prompt('관리자 비밀번호를 입력하세요:');
            if (pw === '3480') {
                openAdminView();
            } else if (pw !== null) {
                alert('비밀번호가 일치하지 않습니다.');
            }
        }

        async function openAdminView() {
            document.getElementById('form_view').classList.add('hidden');
            document.getElementById('dashboard_view').classList.add('hidden');
            document.getElementById('admin_view').classList.remove('hidden');
            
            document.getElementById('headerTitle').innerText = '관리자 시스템';
            document.getElementById('toggleBtn').innerText = '현황 보기';
            currentView = 'admin';

            document.getElementById('adminDetailContainer').classList.add('hidden');
            document.getElementById('adminListContainer').classList.remove('hidden');

            const listEl = document.getElementById('adminList');
            listEl.innerHTML = '<p class="p-4 text-center text-sm text-gray-500">데이터를 불러오는 중입니다...</p>';

            const { data, error } = await supabaseClient.from('evaluations').select('*').order('created_at', { ascending: false });
            if (error) {
                alert("데이터 로드 실패");
                return;
            }
            
            allDashboardData = data || [];
            
            if (allDashboardData.length === 0) {
                listEl.innerHTML = '<p class="p-4 text-center text-sm text-gray-500">제출된 평가가 없습니다.</p>';
                return;
            }

            listEl.innerHTML = allDashboardData.map(d => `
                <li class="p-4 hover:bg-gray-50 cursor-pointer flex justify-between items-center transition-colors" onclick="showAdminDetail(${d.id})">
                    <div>
                        <span class="font-bold text-gray-800 block mb-1">[${d.division || '구분없음'}] ${d.store_name} - ${d.emp_name}</span>
                        <span class="text-xs text-gray-500 bg-gray-200 px-2 py-1 rounded">${d.eval_type === 'form1' ? '웰컴/상담존' : '접객서비스'}</span>
                        <span class="text-xs text-gray-400 ml-1">${new Date(d.visit_time).toLocaleString()}</span>
                    </div>
                    <span class="text-blue-700 font-bold text-lg">${d.total_score}점</span>
                </li>
            `).join('');
        }

        function showAdminDetail(id) {
            const evalData = allDashboardData.find(d => d.id === id);
            if(!evalData) return;

            document.getElementById('adminListContainer').classList.add('hidden');
            document.getElementById('adminDetailContainer').classList.remove('hidden');

            const detailContent = document.getElementById('adminDetailContent');
            const typeName = evalData.eval_type === 'form1' ? '웰컴존·상담존 모니터링' : '판매사원 접객·배웅 서비스 모니터링';
            
            let html = `
                <div class="bg-red-50 p-4 rounded-lg border border-red-200 text-sm space-y-2 mb-4">
                    <p><strong>구분:</strong> ${evalData.division || '미입력'}</p>
                    <p><strong>매장명:</strong> ${evalData.store_name}</p>
                    <p><strong>방문일시:</strong> ${new Date(evalData.visit_time).toLocaleString()}</p>
                    <p><strong>평가자:</strong> ${evalData.emp_name} (사번: ${evalData.emp_id})</p>
                    <p><strong>평가구분:</strong> ${typeName}</p>
                    <p><strong>종합점수:</strong> <span class="text-red-700 font-bold text-lg">${evalData.total_score}점</span></p>
                    <p class="pt-2 border-t border-red-200 mt-2"><strong>평가자 의견:</strong> <br>${evalData.feedback || '없음'}</p>
                </div>
                <!-- 원시 데이터 답안지 영역 -->
                <div id="admin_form_container" class="space-y-6 pt-4"></div>
            `;
            detailContent.innerHTML = html;

            const questions = evalData.eval_type === 'form1' ? questionsForm1 : questionsForm2;
            renderQuestions('admin_form_container', questions, evalData.raw_scores || {});
        }

        function backToAdminList() {
            document.getElementById('adminDetailContainer').classList.add('hidden');
            document.getElementById('adminListContainer').classList.remove('hidden');
        }
        
        function closeAdmin() {
            switchView(); 
        }

        function switchDashboardTab(type) {
            currentDashboardTab = type;
            
            const btn1 = document.getElementById('tabBtn1');
            const btn2 = document.getElementById('tabBtn2');
            const typeTitle = document.getElementById('dashboardTypeTitle');

            if (type === 'form1') {
                btn1.className = "flex-1 py-2 text-sm font-bold rounded shadow-sm bg-white text-blue-700 transition-colors";
                btn2.className = "flex-1 py-2 text-sm font-bold rounded text-gray-500 hover:text-gray-700 transition-colors";
                typeTitle.innerText = "웰컴존·상담존 모니터링 현황";
            } else {
                btn2.className = "flex-1 py-2 text-sm font-bold rounded shadow-sm bg-white text-blue-700 transition-colors";
                btn1.className = "flex-1 py-2 text-sm font-bold rounded text-gray-500 hover:text-gray-700 transition-colors";
                typeTitle.innerText = "판매사원 접객·배웅 서비스 모니터링 현황";
            }

            updateDashboardUI();
        }

        function toggleEvalForm() {
            const type = document.getElementById('evalType').value;
            document.getElementById('form1_container').classList.toggle('hidden', type !== 'form1');
            document.getElementById('form2_container').classList.toggle('hidden', type !== 'form2');
            document.getElementById('feedback_container').classList.toggle('hidden', type === '');
        }

        const questionsForm1 = [
            { id: "f1_q1", cat: "웰컴존", title: "지정·운영 여부", desc: "지정된 웰컴존에서 실제 고객 접점이 형성되고 있는가?" },
            { id: "f1_q2", cat: "웰컴존", title: "위치 적정성", desc: "고객 동선에서 고객을 자연스럽게 인지·응대할 수 있는 위치에 있는가?" },
            { id: "f1_q3", cat: "웰컴존", title: "우선순위", desc: "복수 웰컴존 운영 시 ①→②→③ 순으로 적절하게 운영되고 있는가?" },
            { id: "f1_q4", cat: "웰컴존", title: "공백 대응", desc: "웰컴존이 비어 있는 상황에서도 고객인지가 이루어지고 있는가?" },
            { id: "f1_q5", cat: "상담존", title: "위치 적정성", desc: "상담이 고객시야가 확보된 위치에서 이루어지고 있는가?" },
            { id: "f1_q6", cat: "상담존", title: "상담 중 고객인지", desc: "상담 중에도 신규 고객을 인지할 수 있는 구조 및 행동이 이루어지는가?" },
            { id: "f1_q7", cat: "상황별 운영", title: "1인 근무대응", desc: "1인 근무 시 상담과 고객인지가 상황에 맞게 병행되고 있는가?" },
            { id: "f1_q8", cat: "상황별 운영", title: "복수인원 운영", desc: "상담 발생 시 웰컴존 ①→②→③ 순으로 적절하게 전환되고 있는가?" },
            { id: "f1_q9", cat: "상황별 운영", title: "PeakTime 대응(1)", desc: "고객유입 집중 시 고객인지 및 공통인사를 하는가?" },
            { id: "f1_q10", cat: "상황별 운영", title: "PeakTime 대응(2)", desc: "전원상담 시 상황 주시, 인지 표현, 대기고객 발생에 따른 양해 표현을 하는가?" }
        ];

        const questionsForm2 = [
            { id: "f2_q1", cat: "고객인지 및 입점", title: "고객인지(상담중)", desc: "고객 입점 시 고객을 인지하고 눈맞춤·미소·인사로 반응하는가?" },
            { id: "f2_q2", cat: "고객인지 및 입점", title: "입점인사(대기중)", desc: "고객에게 밝고 호감가는 표정과 목소리로 인사를 하였는가?" },
            { id: "f2_q3", cat: "탐색", title: "자율 탐색 배려", desc: "고객이 편안하게 매장을 둘러볼 수 있도록 적정 거리를 유지하는가?" },
            { id: "f2_q4", cat: "탐색", title: "적절한 접근", desc: "고객의 관심·행동을 관찰하고 고객이 도움을 필요로 할 때 적절하게 응대하는가?" },
            { id: "f2_q5", cat: "상담·연결", title: "신규고객 대응", desc: "상담 중 신규 고객 발생 시 기존 고객 상담과 신규 고객 인지를 적절히 병행하는가?" },
            { id: "f2_q6", cat: "상담·연결", title: "대기고객 안내", desc: "상담 대기 발생 시 고객에게 상황 및 예상 대기시간 등을 적절히 안내하는가?" },
            { id: "f2_q7", cat: "배웅", title: "퇴점 고객인지", desc: "고객 퇴점 시 고객을 인지하고 반응하는가?" },
            { id: "f2_q8", cat: "배웅", title: "배웅 인사", desc: "구매 여부와 관계없이 감사·배웅 인사를 하는가?" },
            { id: "f2_q9", cat: "용모/태도", title: "용모 복장", desc: "깔끔한 용모와 판매자로서 적합한 복장을 갖추고 응대하였는가?" },
            { id: "f2_q10", cat: "용모/태도", title: "톤앤매너", desc: "밝은 표정과 기분 좋은 목소리톤으로 응대하는가?" }
        ];

        function renderQuestions(containerId, questions, savedAnswers = null) {
            const container = document.getElementById(containerId);
            const isReadOnly = savedAnswers !== null;
            
            let html = `
            <div class="flex justify-between text-xs font-bold text-gray-500 mb-4 px-2 text-center bg-gray-50 rounded py-2">
                <div><span class="text-red-500 font-extrabold text-sm block">1점</span>매우 부정</div>
                <div class="flex items-center text-xl text-gray-400">↔</div>
                <div><span class="text-blue-600 font-extrabold text-sm block">5점</span>매우 긍정</div>
            </div>`;

            questions.forEach((q, index) => {
                const ans = isReadOnly ? savedAnswers[q.id] : null; 

                html += `
                <div class="bg-white p-4 border border-gray-200 rounded-lg shadow-sm mb-4 ${isReadOnly ? 'opacity-95' : ''}">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded">${q.cat}</span>
                        <h3 class="font-bold text-gray-800">${index + 1}. ${q.title}</h3>
                    </div>
                    <p class="text-sm text-gray-600 mb-4">${q.desc}</p>
                    <div class="flex justify-between gap-1">
                        ${[1,2,3,4,5].map(score => `
                        <label class="flex-1 text-center ${isReadOnly ? '' : 'cursor-pointer'}">
                            <input type="radio" name="${isReadOnly ? 'admin_'+q.id : q.id}" value="${score}" class="peer sr-only" ${isReadOnly ? 'disabled' : ''} ${ans === String(score) ? 'checked' : ''}>
                            <div class="py-2 border border-gray-300 rounded peer-checked:bg-blue-600 peer-checked:text-white peer-checked:border-blue-600 ${isReadOnly ? '' : 'hover:bg-gray-50'} font-medium transition-colors">${score}</div>
                        </label>
                        `).join('')}
                        <label class="flex-1 text-center ${isReadOnly ? '' : 'cursor-pointer'}">
                            <input type="radio" name="${isReadOnly ? 'admin_'+q.id : q.id}" value="NA" class="peer sr-only" ${isReadOnly ? 'disabled' : ''} ${ans === 'NA' ? 'checked' : ''}>
                            <div class="py-2 border border-gray-300 rounded peer-checked:bg-gray-500 peer-checked:text-white peer-checked:border-gray-500 ${isReadOnly ? '' : 'hover:bg-gray-50'} text-xs font-medium flex items-center justify-center transition-colors break-keep">확인 불가</div>
                        </label>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        renderQuestions('form1_container', questionsForm1);
        renderQuestions('form2_container', questionsForm2);

        async function handleSubmit(event) {
            event.preventDefault();

            const evalType = document.getElementById('evalType').value;
            const questions = evalType === 'form1' ? questionsForm1 : questionsForm2;

            let totalSum = 0;
            let totalValidCount = 0;
            const catStats = {};
            const rawScores = {}; 

            for (let q of questions) {
                const selected = document.querySelector(`input[name="${q.id}"]:checked`);
                if (!selected) {
                    alert('모든 문항을 빠짐없이 선택해주세요.');
                    return;
                }

                const val = selected.value;
                rawScores[q.id] = val; 

                if (!catStats[q.cat]) {
                    catStats[q.cat] = { sum: 0, count: 0 };
                }

                if (val !== 'NA') {
                    const scoreNum = parseInt(val);
                    totalSum += scoreNum;
                    totalValidCount++;

                    catStats[q.cat].sum += scoreNum;
                    catStats[q.cat].count++;
                }
            }

            if (totalValidCount === 0) {
                alert('모든 문항이 확인 불가(N/A) 처리되어 점수를 산출할 수 없습니다.');
                return;
            }

            const totalScore = Math.round((totalSum / totalValidCount) * 20);

            const categoryScores = {};
            for (let cat in catStats) {
                if (catStats[cat].count > 0) {
                    categoryScores[cat] = Math.round((catStats[cat].sum / catStats[cat].count) * 20);
                } else {
                    categoryScores[cat] = null;
                }
            }

            const payload = {
                division: document.getElementById('division').value,
                store_name: document.getElementById('storeName').value,
                visit_time: document.getElementById('visitTime').value,
                emp_id: document.getElementById('empId').value,
                emp_name: document.getElementById('empName').value,
                eval_type: evalType,
                total_score: totalScore,
                category_scores: categoryScores,
                raw_scores: rawScores, 
                feedback: document.getElementById('feedbackText').value || null
            };

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = '저장 중...';

            try {
                const { error } = await supabaseClient.from('evaluations').insert([payload]);
                if (error) throw error;

                alert(`평가가 성공적으로 제출되었습니다! (종합점수: ${totalScore}점)`);
                document.getElementById('evaluationForm').reset();
                toggleEvalForm();
            } catch (err) {
                console.error(err);
                alert('저장 중 오류가 발생했습니다: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '평가 제출하기';
            }
        }

        let myChart = null;
        
        async function loadDashboardData() {
            try {
                const { data, error } = await supabaseClient
                    .from('evaluations')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                
                allDashboardData = data || [];
                updateDashboardUI();

            } catch (err) {
                console.error(err);
                alert('대시보드 데이터를 불러오는데 실패했습니다: ' + err.message);
            }
        }

        function updateDashboardUI() {
            const filterStore = document.getElementById('dashboardStoreFilter').value;
            
            const targetData = allDashboardData.filter(d => {
                const matchTab = d.eval_type === currentDashboardTab;
                const matchStore = (filterStore === 'all' || d.store_name === filterStore);
                return matchTab && matchStore;
            });

            const detailedContainer = document.getElementById('detailedScoresList');
            const recentListContainer = document.getElementById('recentEvalList');

            if (targetData.length === 0) {
                document.getElementById('totalCount').innerText = '0건';
                document.getElementById('totalAvg').innerText = '0점';
                detailedContainer.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">평가 데이터가 없습니다.</p>';
                recentListContainer.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">등록된 평가 데이터가 없습니다.</p>';
                
                const emptyLabels = currentDashboardTab === 'form1' ? ['웰컴존', '상담존', '상황별 운영'] : ['고객인지/입점', '탐색', '상담/연결', '배웅', '용모/태도'];
                renderChart(emptyLabels, Array(emptyLabels.length).fill(0));
                return;
            }

            const totalCount = targetData.length;
            const totalScoreSum = targetData.reduce((acc, cur) => acc + cur.total_score, 0);
            const overallAvg = Math.round(totalScoreSum / totalCount);

            document.getElementById('totalCount').innerText = `${totalCount}건`;
            document.getElementById('totalAvg').innerText = `${overallAvg}점`;

            const questions = currentDashboardTab === 'form1' ? questionsForm1 : questionsForm2;
            let categories = currentDashboardTab === 'form1' 
                ? ['웰컴존', '상담존', '상황별 운영'] 
                : ['고객인지 및 입점', '탐색', '상담·연결', '배웅', '용모/태도'];
            let chartLabels = currentDashboardTab === 'form1'
                ? ['웰컴존', '상담존', '상황별 운영'] 
                : ['고객인지/입점', '탐색', '상담/연결', '배웅', '용모/태도'];

            const itemAgg = {};
            questions.forEach(q => {
                if (!itemAgg[q.cat]) itemAgg[q.cat] = { items: [], catSum: 0, catCount: 0 };
                itemAgg[q.cat].items.push({ id: q.id, title: q.title, sum: 0, count: 0 });
            });

            targetData.forEach(evalData => {
                if (evalData.raw_scores) {
                    questions.forEach(q => {
                        const val = evalData.raw_scores[q.id];
                        if (val && val !== 'NA') {
                            const scoreNum = parseInt(val);
                            const catData = itemAgg[q.cat];
                            const itemData = catData.items.find(i => i.id === q.id);
                            if(itemData) {
                                itemData.sum += scoreNum;
                                itemData.count++;
                            }
                            catData.catSum += scoreNum;
                            catData.catCount++;
                        }
                    });
                }
            });

            const chartScores = categories.map(c => {
                return (itemAgg[c] && itemAgg[c].catCount > 0) 
                    ? Math.round((itemAgg[c].catSum / itemAgg[c].catCount) * 20) 
                    : 0;
            });
            renderChart(chartLabels, chartScores);

            let detailedHtml = '';
            categories.forEach(cat => {
                const catData = itemAgg[cat];
                if(catData) {
                    const catAvg = catData.catCount > 0 ? Math.round((catData.catSum / catData.catCount) * 20) : 0;
                    
                    detailedHtml += `
                        <div class="border border-gray-200 rounded-lg overflow-hidden">
                            <div class="bg-blue-50 p-3 font-bold text-gray-800 flex justify-between items-center border-b border-gray-200">
                                <span>${cat}</span>
                                <span class="text-blue-700">${catAvg}점</span>
                            </div>
                            <div class="p-3 space-y-3 bg-white">
                    `;
                    
                    catData.items.forEach(itemData => {
                        const itemAvg = itemData.count > 0 ? Math.round((itemData.sum / itemData.count) * 20) : 0;
                        const avgText = itemData.count > 0 ? `${itemAvg}점` : `<span class="text-gray-400 font-normal">데이터 없음</span>`;
                        
                        detailedHtml += `
                            <div class="flex justify-between items-center text-sm">
                                <span class="text-gray-600 flex-1 pr-4">${itemData.title}</span>
                                <span class="font-semibold text-gray-800 whitespace-nowrap">${avgText}</span>
                            </div>
                        `;
                    });
                    
                    detailedHtml += `</div></div>`;
                }
            });
            detailedContainer.innerHTML = detailedHtml;

            recentListContainer.innerHTML = targetData.slice(0, 15).map(d => `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded border border-gray-200 text-sm">
                    <span class="font-bold text-gray-800">[${d.division || '-'}] ${d.store_name} - ${d.emp_name}</span>
                    <span class="text-blue-700 font-semibold">${d.total_score}점</span>
                </div>
            `).join('');
        }

        function renderChart(labels, chartData) {
            const ctx = document.getElementById('scoreChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '구분별 평균 점수',
                        data: chartData,
                        backgroundColor: '#3b82f6',
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y',
                    scales: {
                        x: { beginAtZero: true, max: 100 }
                    },
                    plugins: {
                        legend: { display: false }
                    },
                    maintainAspectRatio: false
                }
            });
        }
    </script>
</body>
